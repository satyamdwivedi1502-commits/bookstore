<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Bookstore - Shopping Cart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        h2 {
            color: #333;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .quantity-input {
            width: 50px;
            padding: 5px;
        }
        .remove-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
        }
        .remove-btn:hover {
            background-color: #cc0000;
        }
        .cart-summary {
            margin-top: 20px;
            text-align: right;
            font-size: 1.2em;
        }
        .checkout-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }
        .checkout-btn:hover {
            background-color: #45a049;
        }
        .empty-message {
            display: none;
            text-align: center;
            font-size: 1.2em;
            color: #777;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <h2>Your Shopping Cart</h2>


    <table id="cart-table">
        <thead>
            <tr>
                <th>Book Details</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="cart-items">
            <!-- Mock selected books data populated by JavaScript -->
            <tr data-price="450">
                <td>
                    <strong>Core Java: An Integrated Approach</strong><br>
                    <small>Author: R. Nageswara Rao</small>
                </td>
                <td>₹450.00</td>
                <td>
                    <input type="number" class="quantity-input" value="1" min="1" onchange="updateTotal(this)">
                </td>
                <td class="item-total">₹450.00</td>
                <td>
                    <button class="remove-btn" onclick="removeItem(this)">Remove</button>
                </td>
            </tr>
            <tr data-price="350">
                <td>
                    <strong>Web Technologies</strong><br>
                    <small>Author: Jeffrey C. Jackson</small>
                </td>
                <td>₹350.00</td>
                <td>
                    <input type="number" class="quantity-input" value="2" min="1" onchange="updateTotal(this)">
                </td>
                <td class="item-total">₹700.00</td>
                <td>
                    <button class="remove-btn" onclick="removeItem(this)">Remove</button>
                </td>
            </tr>
        </tbody>
    </table>

    
    <div id="empty-cart" class="empty-message">
        Your shopping cart is currently empty.
    </div>


    <div class="cart-summary" id="cart-summary">
        <strong>Grand Total: <span id="grand-total">₹1150.00</span></strong><br>
        <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
    </div>

    <script>
        
        function updateTotal(input) {
            const row = input.closest('tr');
            const price = parseFloat(row.getAttribute('data-price'));
            const quantity = parseInt(input.value);
            
            if (isNaN(quantity) || quantity < 1) {
                input.value = 1;
                return;
            }

            const itemTotal = price * quantity;
            row.querySelector('.item-total').innerText = '₹' + itemTotal.toFixed(2);
            
            calculateGrandTotal();
        }

        
        function removeItem(button) {
            const row = button.closest('tr');
            row.remove();
            calculateGrandTotal();
        }

        
        function calculateGrandTotal() {
            const rows = document.querySelectorAll('#cart-items tr');
            let grandTotal = 0;

            rows.forEach(row => {
                const price = parseFloat(row.getAttribute('data-price'));
                const quantity = parseInt(row.querySelector('.quantity-input').value);
                grandTotal += price * quantity;
            });

            document.getElementById('grand-total').innerText = '₹' + grandTotal.toFixed(2);

            
            if (rows.length === 0) {
                document.getElementById('cart-table').style.display = 'none';
                document.getElementById('cart-summary').style.display = 'none';
                document.getElementById('empty-cart').style.display = 'block';
            }
        }

        
        function checkout() {
            alert('Proceeding to order placement and secure payment gateway.');
        }
    </script>
</body>
</html>
