<!DOCTYPE html>
<html><head><title>CSS Fonts and Backgrounds</title>
<style>
body{background-image:url('page-bg.jpg');background-size:cover;font-family:Georgia,serif;color:#222}
h1{font-family:'Trebuchet MS',sans-serif;color:#8b0000;text-align:center;text-decoration:underline}
.intro{font-size:20px;font-style:italic;color:#003366}
.code{font-family:'Courier New',monospace;background:#eee;padding:4px}
#box{background-image:url('box-bg.jpg');background-size:cover;color:#fff;padding:30px;width:60%;margin:20px auto;font-weight:bold}
</style></head>
<body>
<h1>Learning CSS</h1>
<p class='intro'>This paragraph uses a class selector with italic Georgia font.</p>
<p>Inline code looks like <span class='code'>color: red;</span> in monospace.</p>
<div id='box'>This box has its own background image, set using an id selector.</div>
</body></html>
