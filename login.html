 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>G.L. Bajaj Online Book Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOP HEADER -->

    <header class="top-header">

        <div class="logo">
            <img src="https://www.glbitm.org/Uploads/image/846imguf_LogoGLBajaj.jpg"
                 class="logo"
                 alt="Logo">
        </div>

        <div class="header-text">

            <h1>G.L. Bajaj Online Book Store</h1>

            <nav>

                <a href="index.html">Home</a> |

                <a href="login.html">Login</a> |

                <a href="register.html">Register</a> |

                <a href="catalogue.html">Catalogue</a> |

                <a href="cart.html">Cart</a>

            </nav>

        </div>

    </header>


    <!-- MIDDLE SECTION: SIDEBAR + LOGIN FORM -->

    <div class="middle-section">

        <!-- LEFT SIDEBAR -->

        <aside class="sidebar">

            <h2>Categories</h2>

            <button>CSE Books</button>

            <button>ECE Books</button>

            <button>Mechanical Books</button>

            <button>IT Books</button>

        </aside>


        <!-- MAIN CONTENT -->

        <main class="main-content">

            <div class="login-box">

                <h2>Login Page</h2>

                <form>

                    <input type="text"
                           placeholder="Username"
                           required>

                    <input type="password"
                           placeholder="Password"
                           required>

                    <button type="submit">
                        Login
                    </button>

                </form>

            </div>

        </main>

    </div>


    <!-- FOOTER -->

    <footer class="footer">

        <p>©Created by SatyamDwivedi</p>

        <p>Roll no. 2501920110333</p>

    </footer>

</body>

</html>
